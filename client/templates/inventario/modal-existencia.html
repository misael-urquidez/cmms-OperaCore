{% load gestion_extras %}
<div class="fallas-modal__dialog" role="document">
  <div class="fallas-modal__content">
    <div class="fallas-modal__header">
      <h2 class="fallas-modal__title">Existencia por estado</h2>
      <button class="fallas-modal__close" type="button" data-dismiss="modal" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="fallas-modal__body">
      {% if existencias %}
        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Estado</th>
                <th>Cantidad</th>
              </tr>
            </thead>
            <tbody>
              {% for e in existencias %}
                <tr>
                  <td>{{ estados_map|get_item:e.estado_refaccion|default:e.estado_refaccion }}</td>
                  <td>{{ e.cantidad }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% else %}
        <p class="fallas-modal__text">Sin existencias registradas para esta refacción.</p>
      {% endif %}
    </div>

    <div class="fallas-modal__footer">
      <button type="button" class="fallas-modal__btn fallas-modal__btn--close" data-dismiss="modal">Cerrar</button>
    </div>
  </div>
</div>
