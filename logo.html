<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OperaCore SVG Dynamic Color</title>
    <style>
        :root {
            /* Variable CSS para controlar el color dinámico del logo */
            --brand-color: #dd6a16;
            --bg-color: #202020;
            --text-color: #cecbc6;
        }

        body {
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            color: #fff;
        }

        .controls input[type="color"] {
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        svg {
            width: 450px;
            height: auto;
        }

        /* Clases para aplicar la variable CSS a los elementos del SVG */
        .logo-accent-fill {
            fill: var(--brand-color) !important;
        }

        .logo-accent-text {
            fill: var(--brand-color) !important;
        }
    </style>
</head>
